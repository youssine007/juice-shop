name: SAST Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sast:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: ../results

      - name: Check for vulnerabilities
        run: |
          SARIF_FILE=$(find ../results -name "*.sarif" | head -1)
          if [ -f "$SARIF_FILE" ]; then
            ALERT_COUNT=$(jq '[.runs[].results[]] | length' "$SARIF_FILE")
            echo "Found $ALERT_COUNT vulnerability results"
            if [ "$ALERT_COUNT" -gt 0 ]; then
              echo "::error::SAST scan found $ALERT_COUNT vulnerabilities! Blocking pipeline."
              exit 1
            fi
          fi
