name: SAST – CodeQL Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  codeql-analysis:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  check-results:
    name: Block on Vulnerabilities
    runs-on: ubuntu-latest
    needs: codeql-analysis
    permissions:
      security-events: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for high/critical alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching open code scanning alerts (severity: high and critical)..."
          ALERT_COUNT=$(gh api \
            "repos/${REPO}/code-scanning/alerts?state=open&severity=high,critical&per_page=100" \
            --jq 'length')

          echo "High/Critical open alerts found: ${ALERT_COUNT}"

          if [ "${ALERT_COUNT}" -gt "0" ]; then
            echo "::error::Pipeline blocked – ${ALERT_COUNT} high/critical vulnerability alert(s) detected."
            echo "Navigate to Security > Code scanning alerts to review findings."
            exit 1
          else
            echo "No high/critical vulnerabilities found. Pipeline passes."
          fi
