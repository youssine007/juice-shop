name: SAST - CodeQL Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  block:
    name: Block on Vulnerabilities
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check for vulnerabilities
        run: |
          ALERTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100")
          COUNT=$(echo "$ALERTS" | jq '[.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical")] | length')
          echo "Found $COUNT high/critical vulnerability alert(s)"
          if [ "$COUNT" -gt 0 ]; then
            echo "Pipeline blocked - $COUNT high/critical vulnerability alert(s) detected."
            exit 1
          fi
